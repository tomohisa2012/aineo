<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AIチャット</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}
.msg{
  margin:10px 0;
  padding:10px 15px;
  border-radius:12px;
  max-width:70%;
}
.user{
  background:#3b82f6;
  margin-left:auto;
}
.ai{
  background:#1e293b;
}
#inputArea{
  display:flex;
  padding:10px;
  background:#020617;
}
input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
}
button{
  margin-left:10px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="メッセージ..." />
  <button onclick="send()">送信</button>
</div>

<script>
let messages = [];

function addMessage(text, cls){
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  messages.push({role:"user", content:text});

  addMessage("考え中...", "ai");

  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ messages })
    });

    const data = await res.json();

    document.querySelector("#chat .ai:last-child").textContent = data.reply;

    messages.push({role:"assistant", content:data.reply});

  }catch(e){
    document.querySelector("#chat .ai:last-child").textContent = "エラー：" + e.message;
  }
}

// Enterで送信
document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key === "Enter") send();
});
</script>

</body>
</html>
