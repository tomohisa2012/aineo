<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIチャット</title>

<style>
body {
  margin:0;
  background:#0f172a;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  height:100vh;
}

#chat {
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.message {
  max-width:70%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

.user {
  background:#3b82f6;
  margin-left:auto;
}

.ai {
  background:#1e293b;
}

#inputArea {
  display:flex;
  padding:10px;
  background:#020617;
}

input {
  flex:1;
  padding:10px;
  border:none;
  border-radius:5px;
}

button {
  margin-left:10px;
  padding:10px 15px;
  border:none;
  background:#22c55e;
  color:#000;
  border-radius:5px;
  cursor:pointer;
}
</style>

</head>
<body>

<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="メッセージ入力...">
  <button onclick="send()">送信</button>
</div>

<script>
let messages = [];

if(localStorage.getItem("chat")){
  messages = JSON.parse(localStorage.getItem("chat"));
}

function addMessage(text, type){
  const chat = document.getElementById("chat");
  const div = document.createElement("div");

  div.className = "message " + type;
  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send(){
  const input = document.getElementById("input");
  const text = input.value;
  if(!text) return;

  addMessage(text, "user");
  messages.push({ role:"user", content:text });

  input.value = "";

  addMessage("考え中...", "ai");

  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ messages })
  });

  const data = await res.json();

  document.querySelectorAll(".ai").pop().remove();

  addMessage(data.reply, "ai");
  messages.push({ role:"assistant", content:data.reply });

  localStorage.setItem("chat", JSON.stringify(messages));
}
</script>

</body>
</html>
