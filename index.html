<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AIチャット</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  display:flex;
  height:100vh;
  background:#f1f5f9;
}

/* サイドバー */
#sidebar{
  width:220px;
  background:#ffffff;
  border-right:1px solid #ddd;
  padding:10px;
  overflow-y:auto;
}

#sidebar button{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border:none;
  background:#3b82f6;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

.chatBtn{
  width:100%;
  padding:8px;
  margin:5px 0;
  border:none;
  background:#eee;
  border-radius:6px;
  cursor:pointer;
}

/* メイン */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* チャット */
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.msg{
  max-width:70%;
  padding:10px 14px;
  border-radius:12px;
  margin:8px 0;
}

.user{
  background:#3b82f6;
  color:white;
  margin-left:auto;
}

.ai{
  background:white;
  border:1px solid #ddd;
}

/* 入力 */
#inputArea{
  display:flex;
  padding:10px;
  border-top:1px solid #ddd;
  background:white;
}

input{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button.send{
  margin-left:10px;
  padding:10px;
}
</style>
</head>

<body>

<div id="sidebar">
  <button onclick="newChat()">＋新規チャット</button>
  <div id="chatList"></div>
</div>

<div id="main">
  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" placeholder="メッセージ..." />
    <button class="send" onclick="send()">送信</button>
  </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats") || "{}");
let currentChatId = null;

// 新規チャット
function newChat(){
  const id = "chat_" + Date.now();
  chats[id] = [];
  currentChatId = id;
  saveChats();
  renderChats();
  renderMessages();
}

// 保存
function saveChats(){
  localStorage.setItem("chats", JSON.stringify(chats));
}

// チャット一覧
function renderChats(){
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id=>{
    const btn = document.createElement("button");
    btn.className = "chatBtn";
    btn.textContent = id;
    btn.onclick = ()=>{
      currentChatId = id;
      renderMessages();
    };
    list.appendChild(btn);
  });
}

// メッセージ表示
function renderMessages(){
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  if(!currentChatId) return;

  chats[currentChatId].forEach(m=>{
    addMessage(m.content, m.role === "user" ? "user" : "ai");
  });
}

// 表示
function addMessage(text, cls){
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

// 送信
async function send(){
  if(!currentChatId) return;

  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  chats[currentChatId].push({role:"user", content:text});
  input.value = "";

  addMessage("考え中...", "ai");

  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ messages: chats[currentChatId] })
    });

    const data = await res.json();

    const last = document.querySelector("#chat .ai:last-child");
    if(last) last.textContent = data.reply;

    chats[currentChatId].push({role:"assistant", content:data.reply});
    saveChats();

  }catch(e){
    const last = document.querySelector("#chat .ai:last-child");
    if(last) last.textContent = "エラー：" + e.message;
  }
}

// Enter送信
document.addEventListener("DOMContentLoaded", ()=>{
  const input = document.getElementById("input");
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter"){
      e.preventDefault();
      send();
    }
  });

  renderChats();
  if(Object.keys(chats).length === 0){
    newChat();
  }
});
</script>

</body>
</html>
