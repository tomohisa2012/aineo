<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AIチャット</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f1f5f9;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* ヘッダー */
header{
  background:white;
  padding:15px;
  font-weight:bold;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* チャット */
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

/* メッセージ */
.msg{
  max-width:70%;
  padding:12px 16px;
  border-radius:16px;
  margin:10px 0;
  line-height:1.5;
}

.user{
  background:#3b82f6;
  color:white;
  margin-left:auto;
}

.ai{
  background:white;
  border:1px solid #ddd;
}

/* 入力エリア */
#inputArea{
  display:flex;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  margin-left:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}

/* 話し方設定 */
#settings{
  display:flex;
  gap:10px;
  padding:10px;
  background:#f8fafc;
  border-bottom:1px solid #ddd;
}

select{
  padding:5px;
}
</style>

</head>
<body>

<header>AIチャット</header>

<div id="settings">
  話し方：
  <select id="style">
    <option value="normal">普通</option>
    <option value="friendly">フレンドリー</option>
    <option value="cool">クール</option>
    <option value="otaku">オタク風</option>
    <option value="teacher">先生っぽい</option>
  </select>
</div>

<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="メッセージを入力..." />
  <button onclick="send()">送信</button>
</div>

<script>
let messages = [];

function addMessage(text, cls){
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

function getSystemPrompt(){
  const style = document.getElementById("style").value;

  const styles = {
    normal: "普通に丁寧に話してください。",
    friendly: "フレンドリーで親しみやすく話してください。",
    cool: "クールで簡潔に話してください。",
    otaku: "オタクっぽく少しテンション高めで話してください。",
    teacher: "先生のように分かりやすく説明してください。"
  };

  return `
あなたは正確さを最優先するAIです。

【重要ルール】
- 不確かな情報は断定しない
- 分からない場合は「分からない」と言う
- 推測する場合は「推測ですが」と言う
- できるだけ事実ベースで答える
- 嘘や作り話は禁止

【話し方】
${styles[style]}
`;
}
  return styles[style];
}

async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  // systemプロンプト追加
  const system = {
    role:"system",
    content:getSystemPrompt()
  };

  const sendMessages = [system, ...messages, {role:"user", content:text}];

  addMessage("考え中...", "ai");

  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ messages: sendMessages })
    });

    const data = await res.json();

    document.querySelector("#chat .ai:last-child").textContent = data.reply;

    messages.push({role:"user", content:text});
    messages.push({role:"assistant", content:data.reply});

  }catch(e){
    document.querySelector("#chat .ai:last-child").textContent = "エラー：" + e.message;
  }
}

document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key === "Enter") send();
});
</script>

</body>
</html>
